[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argos-shared"
version = "0.1.0"
description = "Shared enums and schemas for Argos"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]